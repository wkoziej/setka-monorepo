# ABOUTME: Drop-in dla wireplumber.service — auto-restart po SIGTERM/czystym wyjściu (typowe po suspend/resume).
# ABOUTME: Pakietowy Restart=on-failure NIE wskrzesza wireplumbera po SIGTERM, przez co audio znika do ręcznego startu.

[Unit]
# Po wybudzeniu urządzenia ALSA wracają z opóźnieniem — nie poddawaj się po kilku szybkich próbach.
StartLimitIntervalSec=0

[Service]
# always (nie on-failure) wskrzesza też po SIGTERM i czystym wyjściu; nie rusza intencjonalnego `systemctl --user stop`.
Restart=always
RestartSec=2
